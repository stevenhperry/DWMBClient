name: Build MSI installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Installer/**'
      - 'DWMB.csproj'
      - 'DWMB-AIO.sln'
      - '.github/workflows/installer.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Installer/**'
      - 'DWMB.csproj'
      - 'DWMB-AIO.sln'
      - '.github/workflows/installer.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Determine build kind
        id: buildkind
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            "kind=release" >> $env:GITHUB_OUTPUT
            "artifact_name=DWMB-AIO-Client-Setup" >> $env:GITHUB_OUTPUT
          } else {
            "kind=test" >> $env:GITHUB_OUTPUT
            "artifact_name=DWMB-AIO-Client-Setup-TESTBUILD-placeholder-urls" >> $env:GITHUB_OUTPUT
          }

      - name: Inject production and development server URLs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SERVER_URL: ${{ secrets.DWMB_SERVER_URL }}
          SERVER_URL_DEV: ${{ secrets.DWMB_SERVER_URL_DEV }}
        run: |
          function Set-ServerConfigConstant {
            param([string]$Content, [string]$ConstantName, [string]$SecretName, [string]$Value)
            if ([string]::IsNullOrWhiteSpace($Value)) {
              throw "$SecretName secret is not set; refusing to build a tagged release with the placeholder server URL."
            }
            $escaped = $Value -replace '"', '\"'
            $pattern = "public const string $ConstantName = `".*?`";"
            $updated = [regex]::Replace($Content, $pattern, "public const string $ConstantName = `"$escaped`";")
            if ($updated -eq $Content) {
              throw "Failed to patch ServerConfig.cs: $ConstantName constant not found."
            }
            return $updated
          }

          $path = "DWMB.Serialization/ServerConfig.cs"
          $content = Get-Content -Path $path -Raw
          $content = Set-ServerConfigConstant -Content $content -ConstantName "ServerUrl" -SecretName "DWMB_SERVER_URL" -Value $env:SERVER_URL
          $content = Set-ServerConfigConstant -Content $content -ConstantName "ServerUrlDev" -SecretName "DWMB_SERVER_URL_DEV" -Value $env:SERVER_URL_DEV
          Set-Content -Path $path -Value $content -NoNewline

      - name: Build MSI
        run: dotnet build Installer/DWMB.Installer.wixproj -c Release

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path Installer -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            throw "No .msi was produced by the build."
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Summarize build kind
        shell: pwsh
        run: |
          if ("${{ steps.buildkind.outputs.kind }}" -eq "release") {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "✅ **Release build** — real server URLs were injected from the \`DWMB_SERVER_URL\`/\`DWMB_SERVER_URL_DEV\` repo secrets. Safe to distribute as \`${{ steps.buildkind.outputs.artifact_name }}\`."
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "⚠️ **Test build** (not a \`v*\` tag push) — the MSI contains the PLACEHOLDER \`ServerConfig\` URLs (\`https://example.com\`) and will NOT reach the real DWMB server. Do not distribute \`${{ steps.buildkind.outputs.artifact_name }}\` to end users. To publish a real release, push a \`v*\` tag."
          }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.buildkind.outputs.artifact_name }}
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
