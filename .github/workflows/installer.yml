name: Build MSI installer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Installer/**'
      - 'DWMB.csproj'
      - 'DWMB-AIO.sln'
      - '.github/workflows/installer.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Installer/**'
      - 'DWMB.csproj'
      - 'DWMB-AIO.sln'
      - '.github/workflows/installer.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Inject production server URL
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SERVER_URL: ${{ secrets.DWMB_SERVER_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SERVER_URL)) {
            throw "DWMB_SERVER_URL secret is not set; refusing to build a tagged release with the placeholder server URL."
          }
          $path = "DWMB.Serialization/ServerConfig.cs"
          $content = Get-Content -Path $path -Raw
          $escaped = $env:SERVER_URL -replace '"', '\"'
          $updated = $content -replace 'public const string ServerUrl = ".*?";', "public const string ServerUrl = `"$escaped`";"
          if ($updated -eq $content) {
            throw "Failed to patch ServerConfig.cs: ServerUrl constant not found."
          }
          Set-Content -Path $path -Value $updated -NoNewline

      - name: Build MSI
        run: dotnet build Installer/DWMB.Installer.wixproj -c Release

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path Installer -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) {
            throw "No .msi was produced by the build."
          }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DWMB-AIO-Client-Setup
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
